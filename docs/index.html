<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>weather-app</title>
    <script type="module" crossorigin src="/weather-app/assets/index-Cnzz9zg2.js"></script>
    <link rel="stylesheet" crossorigin href="/weather-app/assets/index-jl749MZv.css">
  </head>
  <body>
    <div class="container">
      <header>
        <div class="logo">
          <img src="/weather-app/assets/logo-hk6Dn71M.svg" alt="logo image" class="logo__img">
        </div>
        <div class="units">
          <button class="units__btn">
            <img src="/weather-app/assets/icon-units-HpdfyhB2.svg" alt="Gear icon">
            <span class="units__btn-title">Units</span>
            <img src="/weather-app/assets/icon-dropdown-nxe1HhpB.svg" class="units__btn-drop-icon" alt="Dropdown icon">
          </button>
          <div class="units__menu-container">
            <span class="units__title">Switch metrics</span>
            <ul class="units__menu">
              <li class="units__item">
                <div class="submenu">
                  <span class="submenu__title">Temperature</span>
                  <ul class="submenu__menu">
                    <li class="submenu__item">
                      <label tabindex="0">
                        <span>Celsius (&deg;C)</span>
                        <input type="radio" name="metric" value="celsius" checked>
                        <img src="/weather-app/assets/icon-checkmark-DwaxEmvd.svg" alt="Checked icon" aria-hidden="true">
                      </label>
                    </li>
                    <li class="submenu__item">
                      <label tabindex="0">
                        <span>Fahrenheit (&deg;F)</span>
                        <input type="radio" name="metric" value="fahrenheit">
                        <img src="/weather-app/assets/icon-checkmark-DwaxEmvd.svg" alt="Checked icon" aria-hidden="true">
                      </label>
                    </li>
                  </ul>
                </div>
                <div class="submenu">
                  <span class="submenu__title">Wind Speed</span>
                  <ul class="submenu__menu">
                    <li class="submenu__item">
                      <label tabindex="0">
                        <span>Km/h</span>
                        <input type="radio" name="speed" value="km" checked>
                        <img src="/weather-app/assets/icon-checkmark-DwaxEmvd.svg" alt="Checked icon" aria-hidden="true">
                      </label>
                    </li>
                    <li class="submenu__item">
                      <label tabindex="0">
                        <span>Mph</span>
                        <input type="radio" name="speed" value="m">
                        <img src="/weather-app/assets/icon-checkmark-DwaxEmvd.svg" alt="Checked icon" aria-hidden="true">
                      </label>
                    </li>
                  </ul>
                </div>
                <div class="submenu">
                  <span class="submenu__title">Precipitation</span>
                  <ul class="submenu__menu">
                    <li class="submenu__item">
                      <label tabindex="0">
                        <span>Millimeters (mm)</span>
                        <input type="radio" name="Precipitation" value="mm" checked>
                        <img src="/weather-app/assets/icon-checkmark-DwaxEmvd.svg" alt="Checked icon" aria-hidden="true">
                      </label>
                    </li>
                    <li class="submenu__item">
                      <label tabindex="0">
                        <span>Inches (in)</span>
                        <input type="radio" name="Precipitation" value="in">
                        <img src="/weather-app/assets/icon-checkmark-DwaxEmvd.svg" alt="Checked icon" aria-hidden="true">
                      </label>
                    </li>
                  </ul>
                </div>
              </li>
            </ul>
          </div>
        </div>
      </header>
      <main class="main">
        <h1 class="header">
          How's the sky looking today?
        </h1>
        <form class="search">
          <div class="search__input-container">
            <img src="/weather-app/assets/icon-search-BBikmxiw.svg" alt="search icon">
            <input type="text" name="place" class="search__input" placeholder="Search for a place...">
          </div>
          <button type="submit" class="search__btn">Search</button>
        </form>
        <div class="weather-box">
          <div class="daily-weather">
            <div class="weather-today">
              <!-- <div>
                <span class="weather-today__location">Berlin, Germany</span>
                <span class="weather-today__date">Tuesday, Aug 5, 2025</span>
              </div>
              <div class="weather-today__temperature-box">
                <img class="weather-today__icon" src="./src/assets/images/icon-sunny.webp" alt="Sun icon">
                <span class="weather-today__temperature">20&deg;</span>
              </div> -->
            </div>
            <div class="weather-today__additional">
              <div class="feels-like">
                <span class="feels-like__title">Feels like</span>
                <span class="feels-like__content" id="feels-like"></span>
              </div>
              <div class="feels-like">
                <span class="feels-like__title">Humidity</span>
                <span class="feels-like__content" id="humidity"></span>
              </div>
              <div class="feels-like">
                <span class="feels-like__title">Wind</span>
                <span class="feels-like__content" id="wind"></span>
              </div>
              <div class="feels-like">
                <span class="feels-like__title">Precipatation</span>
                <span class="feels-like__content" id="precipatation"></span>
              </div>
            </div>
            <div class="daily-forecast">
              <h2 class="daily-forecast__header">Daily forecast</h2>
              <div class="daily-forecast__week">
                <div class="day">
                  <span class="day__title">Tue</span>
                  <div class="day__content"></div>
                </div>
                <div class="day">
                  <span class="day__title">Wed</span>
                  <div class="day__content"></div>
                </div>
                <div class="day">
                  <span class="day__title">Thu</span>
                  <div class="day__content"></div>
                </div>
                <div class="day">
                  <span class="day__title">Fri</span>
                  <div class="day__content"></div>
                </div>
                <div class="day">
                  <span class="day__title">Sat</span>
                  <div class="day__content"></div>
                </div>
                <div class="day">
                  <span class="day__title">Sun</span>
                  <div class="day__content"></div>
                </div>
                <div class="day">
                  <span class="day__title">Mon</span>
                  <div class="day__content"></div>
                </div>
              </div>
            </div>
          </div>
          <div class="hourly-weather">
            <h2 class="hourly-weather__header">Hourly forecast</h2>
            <div class="hourly-weather__day-select">
              <select name="day" class="hourly-weather__select-input">
                <button>
                  <selectedcontent></selectedcontent>
                  <span class="hourly-weather__select-icon">
                    <img src="./src/assets/images/icon-dropdown.svg" alt="dropdown icon">
                  </span>
                </button>
                <option class="hourly-weather__option" value="0">Sunday</option>
                <option class="hourly-weather__option" value="1">Monday</option>
                <option class="hourly-weather__option" value="2">Tuesday</option>
                <option class="hourly-weather__option" value="3">Wednesday</option>
                <option class="hourly-weather__option" value="4">Thursday</option>
                <option class="hourly-weather__option" value="5">Friday</option>
                <option class="hourly-weather__option" value="6">Saturday</option>
              </select>
            </div>
            <div class="hourly-weather__hours-container"></div>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
